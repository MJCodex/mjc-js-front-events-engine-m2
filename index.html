<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>Metin2 Iberia · Calendario</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <span class="eyebrow">METIN2 IBERIA</span>
    <h1>Calendario de eventos</h1>
    <p>Permanentes · rotación · horarios en tu zona</p>
  </div>
  <div class="controls">
    <button id="prevMonth" aria-label="Mes anterior">‹</button>
    <select id="monthSelect" aria-label="Mes"></select>
    <select id="yearSelect" aria-label="Año"></select>
    <button id="nextMonth" aria-label="Mes siguiente">›</button>
    <button id="todayBtn">Hoy</button>
  </div>
</header>
<main class="page">
  <section class="summary">
    <div><span class="live-dot"></span><strong id="monthTitle"></strong><span class="muted"> · Iberia</span></div>
    <div class="legend"><span><i class="static-dot"></i>Semanal</span><span><i class="rotation-dot"></i>Rotación</span><span><i class="recurrence-dot"></i>Periódico</span></div>
  </section>
  <section class="calendar-wrap"><div id="calendar" class="calendar"></div></section>
  <section class="details">
    <article><h2>¿Cómo funciona?</h2><p>Los eventos semanales ocurren siempre el mismo día de la semana. Los eventos de rotación se alternan cada dos semanas entre fin de semana y fin de semana.</p></article>
  </section>
</main>
<script src="time-utils.js"></script>
<script src="events.js"></script>
<script src="calendar.js"></script>
<script src="app.js"></script>
</body>
</html>
